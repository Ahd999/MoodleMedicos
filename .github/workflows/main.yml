name: Build Android APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: pip-${{ hashFiles('buildozer.spec') }}
        restore-keys: pip-

    - name: Cache Android SDK
      uses: actions/cache@v3
      with:
        path: ~/.buildozer/android/platform/android-sdk
        key: android-sdk-static
        restore-keys: android-sdk-static

    - name: Cache Android NDK
      uses: actions/cache@v3
      with:
        path: ~/.buildozer/android/platform/android-ndk-r25b
        key: android-ndk-r25b-static
        restore-keys: android-ndk-r25b-static

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-pip \
          build-essential \
          git \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libssl-dev \
          libffi-dev \
          openjdk-17-jdk \
          autoconf \
          automake \
          libtool \
          pkg-config

        echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
        echo "PATH=$PATH:/usr/lib/jvm/java-17-openjdk-amd64/bin" >> $GITHUB_ENV

    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo apt-get clean
        df -h

    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: pip-${{ hashFiles('buildozer.spec') }}
        restore-keys: pip-

    - name: Cache Buildozer global directory
      uses: actions/cache@v3
      with:
        path: .buildozer_global
        key: buildozer-global-${{ hashFiles('buildozer.spec') }}
        restore-keys: buildozer-global-

    - name: Cache Buildozer directory
      uses: actions/cache@v3
      with:
        path: .buildozer
        key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
        restore-keys: buildozer-${{ runner.os }}-

    - name: Cache Android SDK and NDK
      uses: actions/cache@v3
      with:
        path: |
          ~/.buildozer/android/platform/android-sdk
          ~/.buildozer/android/platform/android-ndk-*
        key: android-sdk-ndk-static
        restore-keys: android-sdk-ndk-static

    - name: Cache Python packages built by p4a
      uses: actions/cache@v3
      with:
        path: ~/.buildozer/android/platform/build-*
        key: p4a-packages-${{ hashFiles('buildozer.spec') }}
        restore-keys: p4a-packages-

    - name: Install Cython and Buildozer
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install --upgrade Cython==0.29.33
        python -m pip install buildozer==1.5.0

    - name: Build with Buildozer
      run: yes | buildozer android debug
      env:
        BUILDOZER_WARN_ON_ROOT: 1
        
    - name: Upload APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.repository.name }}-debug
        path: |
          bin/*.apk
          bin/*.apk.idsig
        if-no-files-found: warn
        retention-days: 3

    - name: Clean up large build artifacts before caching
      if: always()
      run: |
        # Remove final packaged app dirs — rebuilt every run, no point caching
        rm -rf .buildozer/android/platform/build-*/dists/
        # Remove the bin/ APK — already uploaded as artifact
        rm -rf bin/
        df -h
